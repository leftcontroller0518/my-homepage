<meta name="description" content="学校からこんにちはの記事です。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Cpath d='M10 8h4v12h8v4H10z' fill='%23ffffff'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<div class="header-spacer"></div>

<main class="container section">
  <p class="breadcrumb">
    <a href="/">HOME</a> / <a href="/blog/">BLOG</a> / 学校からこんにちは
  </p>

  <div id="blog-content"></div>
</main>

<div id="footer-placeholder"></div>

<script src="/assets/js/include.js"></script>
<script>
async function loadBlogContent() {
  try {
    const response = await fetch('/blog/2026-8-26-gakkou-kara-konnnichiwa.md');
    let mdContent = await response.text();
    
    // 最初の行（日付）を削除
    const lines = mdContent.split('\n');
    if (lines.length > 0 && lines[0].match(/^\d{4}\/\d{1,2}\/\d{1,2}$/)) {
      lines.shift(); // 最初の行を削除
      mdContent = lines.join('\n');
    }
    
    const container = document.getElementById('blog-content');
    if (typeof marked !== 'undefined' && marked.parse) {
      // marked.jsの設定を最適化
      marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: false,
        mangle: false
      });
      container.innerHTML = marked.parse(mdContent);
    } else {
      container.innerHTML = `<pre style="white-space:pre-wrap;font-family:inherit;">${mdContent}</pre>`;
    }
  } catch (error) {
    console.error('マークダウンファイルの読み込みに失敗しました:', error);
  }
}

document.addEventListener('DOMContentLoaded', loadBlogContent);
</script>
</body>
</html>
